       <!DOCTYPE html>
<html lang="es">

<body>


<div id="contenido">

    <h1 class="titulo">FORMULARIO</h1>

    <form>

        <label>Nombre:</label><br>
        <input type="text" name="nombre"><br><br>

        <label>Apellidos:</label><br>
        <input type="text" name="apellidos"><br><br>

        <label>Dirección:</label><br>
        <input type="text" name="direccion"><br><br>

        <label>Correo electrónico:</label><br>
        <input type="email" name="correo"><br><br>

        <label>Teléfono:</label><br>
        <input type="tel" name="telefono"><br><br>

        <label>Seleccione el tipo de bicicleta:</label><br>

        <select name="bicicleta">
            <option value="infantil1">Bicicleta infantil 1</option>
            <option value="infantil2">Bicicleta infantil 2</option>
            <option value="infantil3">Bicicleta infantil 3</option>
            <option value="electrica">Bicicleta eléctrica</option>
            <option value="deportiva">Bicicleta deportiva</option>
            <option value="infantil4">Bicicleta infantil 4</option>
        </select>

        <br><br>

        <label>Estado de la bicicleta:</label><br>

        <input type="radio" name="estado" value="nueva">
        Nueva

        <input type="radio" name="estado" value="usada">
        Puede ser usada

        <br><br>

        <label>Observaciones:</label><br>
        <textarea name="observaciones" rows="6" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar">

    </form>

    <br>

</div>

</body>
